<!doctype html>
<html><head><meta charset="utf-8"><title>universalMods gallery 1</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="ph.css">
<style>
  .center { position: absolute; left: 0; right: 0; top: 46px; text-align: center; z-index: 3; }
  .center .brand { justify-content: center; font-size: 22px; }
  .center h1 { margin-top: 18px; font-size: 54px; line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; }
  .center p { margin: 14px auto 0; font-size: 19px; color: var(--muted); }
  .center p strong { color: var(--text); font-weight: 600; }
  .scene { position: absolute; left: 0; right: 0; top: 300px; height: 520px; perspective: 1800px; }
  .window { left: 155px; top: 0; width: 960px; transform: rotateX(18deg); transform-origin: 50% 0; }
  .window .crop { width: 960px; }
  .tag { font-size: 15px; }
  .t1 { --c: var(--green); left: 50px; top: 468px; }
  .t2 { --c: var(--amber); left: 175px; top: 262px; }
  .t3 { --c: var(--pink); right: 50px; top: 282px; }
</style></head>
<body><div class="stage">
  <div class="center">
    <div class="brand"><span class="mark"></span><span class="word">universal<b class="grad">Mods</b></span></div>
    <h1>Run a team of coding agents.<br><span class="grad">Mod everything.</span></h1>
    <p>A local web floor for <strong>Codex</strong> and <strong>Claude Code</strong> agents. Open source, MIT.</p>
  </div>
  <div class="scene">
    <div class="window">
      <div class="bar"><span></span><span></span><span></span><em>127.0.0.1:4477/?layout=showcase</em></div>
      <div class="crop" data-src="shot-floor.png" data-box="0,0,1600,1000"></div>
    </div>
  </div>
  <div class="tag t1"><b>1</b>Live terminals</div>
  <div class="tag t2"><b>2</b>Orchestrator plans &amp; delegates</div>
  <div class="tag t3"><b>3</b>Mods from a sentence <small>(Mods &amp; skills)</small></div>
</div>
<script src="crop.js"></script>
</body></html>
