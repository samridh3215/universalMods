<!doctype html>
<html><head><meta charset="utf-8"><title>universalMods og</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --W: 1200px; --H: 630px; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; z-index: 3; }
  .brand { font-size: 34px; margin-bottom: 30px; }
  h1 { font-size: 60px; line-height: 1.03; font-weight: 800; letter-spacing: -0.035em; }
  h1 .grad { display: block; padding-bottom: 4px; }
  p.sub { margin-top: 22px; font-size: 22px; line-height: 1.4; color: var(--muted); max-width: 470px; }
  p.sub strong { color: var(--text); font-weight: 600; }
  .scene { position: absolute; left: calc(var(--W) - 590px); top: 0; width: 980px; height: var(--H); perspective: 2000px; }
  .window { left: 0; top: 80px; width: 980px; transform: rotateY(-18deg) rotateX(4deg); transform-origin: 0 50%; }
  .window .crop { width: 980px; }
  .card { --c: var(--pink); z-index: 4; left: calc(var(--W) - 640px); top: 392px; width: 360px; }
</style></head>
<body><div class="stage">
  <div class="copy">
    <div class="brand"><span class="mark"></span><span class="word">universal<b class="grad">Mods</b></span></div>
    <h1>Run a team of<br>coding agents.<span class="grad">Mod everything.</span></h1>
    <p class="sub">A local, moddable floor for <strong>Codex</strong> and <strong>Claude Code</strong> agents.</p>
  </div>
  <div class="scene">
    <div class="window">
      <div class="bar"><span></span><span></span><span></span><em>127.0.0.1:4477</em></div>
      <div class="crop" data-src="shot-floor.png" data-box="0,0,1600,1000"></div>
    </div>
  </div>
  <div class="card"><div class="crop" data-src="shot-newmod.png" data-box="994,98,500,180"></div></div>
</div>
<script src="crop.js"></script>
</body></html>
