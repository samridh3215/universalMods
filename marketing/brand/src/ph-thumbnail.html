<!doctype html>
<html><head><meta charset="utf-8"><title>universalMods thumbnail</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --W: 240px; --H: 240px; }
  .stage { display: grid; place-items: center;
    background:
      radial-gradient(80% 80% at 15% 10%, rgba(107,155,255,.55), transparent 60%),
      radial-gradient(80% 80% at 90% 20%, rgba(164,139,240,.5), transparent 60%),
      radial-gradient(90% 90% at 80% 100%, rgba(240,122,168,.5), transparent 60%),
      #0d0f16; }
  .stage::before { display: none; }
  svg { width: 132px; height: 132px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
</style></head>
<body><div class="stage">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b9bff"/><stop offset=".55" stop-color="#a48bf0"/><stop offset="1" stop-color="#f07aa8"/></linearGradient></defs>
    <rect x="2" y="2" width="8" height="8" rx="2" fill="#f2f3f7"/>
    <rect x="14" y="2" width="8" height="8" rx="2" fill="#f2f3f7"/>
    <rect x="2" y="14" width="8" height="8" rx="2" fill="#f2f3f7"/>
    <rect x="14" y="14" width="8" height="8" rx="2" fill="url(#g)" stroke="#fff" stroke-opacity=".35" stroke-width=".4"/>
  </svg>
</div></body></html>
