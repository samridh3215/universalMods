name: Plugin Security Scan

# HOL AI plugin scanner (recommended by awesome-ai-plugins): fails on any high/critical
# finding or a score below 80. Actions are pinned to verified commit SHAs.
on: [pull_request, push]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@6ed3f34b07bbd674da934c532cc7473ab6365d29 # v1.2.821
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
